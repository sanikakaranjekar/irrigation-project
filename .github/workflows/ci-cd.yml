name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# If you push twice quickly, cancel the older run instead of wasting time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # CI: runs on every push AND every pull request
  # ---------------------------------------------------------------
  test:
    name: Lint, train & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (catches syntax errors and messy code)
        run: flake8 .

      - name: Train & compare all models (also validates the training pipeline works)
        run: python train_model.py

      - name: Run tests
        run: pytest -v

      - name: Upload trained model + comparison results
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: |
            model.joblib
            metrics.json
            model_comparison.json

  # ---------------------------------------------------------------
  # CD: only runs on pushes to main, and only if CI passed
  # ---------------------------------------------------------------
  docker-build-and-push:
    name: Build, smoke-test & publish Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: irrigation-api:test

      - name: Smoke-test the container (start it and call the API)
        run: |
          docker run -d --name api -p 8000:8000 irrigation-api:test
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Soil_Type":"Clay","Soil_pH":6.5,"Soil_Moisture":25.0,"Organic_Carbon":0.6,"Electrical_Conductivity":1.5,"Temperature_C":30.0,"Humidity":55.0,"Rainfall_mm":500.0,"Sunlight_Hours":8.0,"Wind_Speed_kmh":10.0,"Crop_Type":"Wheat","Crop_Growth_Stage":"Vegetative","Season":"Rabi","Irrigation_Type":"Drip","Water_Source":"Groundwater","Field_Area_hectare":2.0,"Mulching_Used":"Yes","Previous_Irrigation_mm":20.0,"Region":"North"}'
          docker logs api
          docker stop api

      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only reached if the smoke test passed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
